<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Gateway API Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090E;
      --card: #101622;
      --border: rgba(255, 255, 255, 0.08);
      --text: #F8FAFC;
      --muted: #64748B;
      --emerald: #10B981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 4px 12px;
      border-radius: 999px;
      width: fit-content;
    }
    .pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
    }
    h1 {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }
    .json-preview {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 11.5px;
      color: #38BDF8;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="status-card">
    <div class="badge">
      <span class="pulse"></span>
      <span>API Service Active</span>
    </div>
    <h1>Payment Gateway Server</h1>
    <p>Automated payment processing services are operational. All payment webhooks and API endpoints are actively listening.</p>
    <pre class="json-preview">{
  "status": true,
  "service": "Payment Gateway Engine",
  "engine": "Vercel Serverless",
  "version": "1.0.0"
}</pre>
  </div>
</body>
</html>
